<ion-header [translucent]="true" style=" box-shadow: none !important;">
  <ion-toolbar class="custom-toolbar">
    
    <ion-button fill="clear" slot="start" (click)="goBack()">
      <ion-icon id="backicon" name="chevron-back-outline"></ion-icon>
    </ion-button>
    
    <ion-title class="centered-title">
      <p style="color: #5516D9; font-weight: 700; font-size: 23px;">Verify OTP</p>
    </ion-title>
  
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="main-content">
    <div style="margin-top: 60px;">
      <img src="../../assets/Images/forget-page.png" height="250px" width="300px" alt="otp-img">
    </div>
    
    <div style="margin-top: 50px; width: 80%;">
      <form [formGroup]="forgetForm" (ngSubmit)="onSubmit()">
        <ion-input formControlName="phone" maxlength="10" placeholder="Phone Number" label="Enter Your Phone Number" type="Number" helperText=" " errorText="Enter your Mobile Number" required labelPlacement="stacked">
          <ion-icon slot="start" name="call-outline"></ion-icon>
        </ion-input>
      </form>
    </div>

    <div style="width: 80%; margin-top: 99px;">
      <ion-button strong="600" type="button" shape="round" id="login-btn">
        Continue
      </ion-button>
    </div>
  </div>
</ion-content>
