  <!-- in menu header & content -->
<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu Content</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">This is the menu content.</ion-content>
</ion-menu>

<!-- out menu-btn header & content -->
<div class="ion-page" id="main-content">
  <!-- header -->
   
  <ion-header style=" box-shadow: none !important;">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title class="centered-title">
        <!-- <p id="phead">Create Your First Bill</p> -->
        <p id="phead">{{ heading }}</p>
      </ion-title>
      <ion-button fill="clear" slot="end">
        <ion-icon id="headicon" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-toolbar>
  </ion-header> 
  
                              <!-- content -->.

<!-- fix + button -->
  <ion-fab id="ion-fab" horizontal="end">
    <ion-fab-button>
      <ion-icon id="fab-icon" name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- bottom tab buttons -->
  <ion-tabs (ionTabsWillChange)="logTabName($event)">
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="invoice">
        <ion-icon name="clipboard"></ion-icon>
        Invoice
      </ion-tab-button>
      <ion-tab-button tab="parties">
        <ion-icon name="people"></ion-icon>
        Parties
      </ion-tab-button>
      <ion-tab-button routerLink="/profile">
        <ion-icon name="person-circle-outline"></ion-icon>
        Profile
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>

  
</div>
