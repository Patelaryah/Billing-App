<ion-header [translucent]="true" style=" box-shadow: none !important; height: 56px;">
  <ion-toolbar>
    <ion-title>add_parties</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- upper content -->
  <div class="div_first">
    <p id="text1">Add New Party</p>
    <ion-input label="Party Name*" label-placement="floating" fill="outline" placeholder="e.g. Aman malik"></ion-input>
    <p id="text2">Add party through contacts</p>
  </div>

  <!-- stace between 2 div -->
  <div style="height: 54%;"></div>
  
  <!-- lower content -->
  <div class="div_second">
    <div style="display: flex;">
      <ion-button id="btn1" fill="outline">Outline</ion-button>
      <ion-button style="width: 100%; --background: #D6C6F5;">Outline</ion-button>
    </div>
    <div id="inner_div_2">
      <p id="text1">Parties are people you do business with. Use them for invoices and to keep of your receivables & payables</p>
    </div>
      
  </div>
</ion-content>
