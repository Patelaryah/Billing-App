<ion-header [translucent]="true" style=" box-shadow: none !important;">
  <ion-toolbar class="custom-toolbar">
    
    <ion-button fill="clear" slot="start" (click)="goBack()">
      <ion-icon id="backicon" name="chevron-back-outline"></ion-icon>
    </ion-button>
    
    <ion-title class="centered-title">
      <p style="color: #5516D9; font-weight: 700; font-size: 23px;">Verify OTP</p>
    </ion-title>
  
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="main-content">
    <div style="margin-top: 60px;">
      <img *ngIf="visible" src="../../assets/Images/forget-page.png" height="250px" width="300px" alt="forget-img">
      <img *ngIf="!visible" src="../../assets/Images/forget-password.png" height="250px" width="300px" alt="forget-img">
    </div>
    
    <!-- Password UI -->
    <div *ngIf="!visible" style="margin-top: 30px; width: 80%;">
      <form [formGroup]="forgetFormP" (ngSubmit)="onSubmit()">
        <ion-input 
          placeholder="Password"
          required
          formControlName="password" 
          maxlength="18"
          (ionFocus)="onPasswordChange()" 
          labelPlacement="stacked" 
          [type]="passwordVisible ? 'text' : 'password'" 
          label="Password"
          helperText="Ex. Abcd@123, Abcd123@"
          errorText="Invalid Password type or min length is 8 char"
        >
          <ion-icon 
            slot="start" 
            name="lock-closed-outline" 
            
          ></ion-icon>
          <ion-button 
            *ngIf="pass" 
            (click)="togglePasswordVisibility()" 
            fill="clear" 
            slot="end" 
            aria-label="Show/hide"
          >
            <ion-icon 
              slot="icon-only" 
              [name]="passwordVisible ? 'eye-outline' : 'eye-off-outline'" 
              
            ></ion-icon>
          </ion-button>
        </ion-input>
      
        <!-- confirm password -->
        <ion-input 
        placeholder="Confirm Password"
          required
          maxlength="18"
          formControlName="confirmPassword" 
          labelPlacement="stacked" 
          type="password" 
          label="Confirm Password"
          errorText=" "
          [helperText]="helpervisible ? 'Confirm your Password.' : '' "
          (ionBlur)="onInputBlur()"
        >
          <ion-icon 
            slot="start" 
            name="lock-closed-outline" 
          ></ion-icon>
        </ion-input>
        
        <div style="width: 100%;">
          <p style="color: #f24c58; margin-top: 3px; font-size: 12px">{{passwordsDoNotMatch}}</p>
        </div>
        <ion-button style="width: 100%; margin-top: 50px;" strong="600" type="submit" shape="round" id="login-btn">
          Continue pass change
        </ion-button>
        
      </form>
    </div>

    <!-- otp UI -->
    <div *ngIf="visible" style="margin-top: 30px; width: 80%;">
      <form [formGroup]="forgetFormN" (ngSubmit)="onSend()">
        <ion-input formControlName="phone" maxlength="10" placeholder="Phone Number" label="Enter Your Phone Number" type="Number" helperText=" " errorText="Enter your Mobile Number" required labelPlacement="stacked">
          <ion-icon slot="start" name="call-outline"></ion-icon>
        </ion-input>

        <ion-button style="width: 100%; margin-top: 94px;" strong="600" type="submit" shape="round" id="login-btn">
          Continue to otp
        </ion-button>

      </form>
    </div>


  </div>
</ion-content>
